# One command brings up the whole app:  docker compose up --build
# Then open http://localhost:3000 (or whatever FRONTEND_PORT is).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      # Docker's internal network resolves "mongo" to the container above.
      MONGO_URI: mongodb://mongo:27017/video-conference-app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      # Comma-separated list of origins allowed to call the API / sockets.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mongo-data:
