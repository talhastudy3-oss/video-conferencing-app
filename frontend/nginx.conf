server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Single-page app: unknown paths (e.g. /meeting/abc-defg-hij) fall back
    # to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend container. Same origin as the frontend, so the
    # app's default "/api" base URL works with no extra configuration.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO: needs the HTTP/1.1 Upgrade headers for WebSockets, and a
    # long read timeout so idle-but-open connections aren't cut.
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
